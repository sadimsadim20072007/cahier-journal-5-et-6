<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولّد المذكرة اليومية – المدرسة الرائدة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f1f4f7;--panel:#fff;--ink:#16324f;--mute:#5b6b7a;--line:#cfd8e0;--acc:#2f7d6b;--acc-ink:#fff;--gold:#e0a526;--sheet:#fff;--sheet-ink:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a24;--panel:#17252f;--ink:#e6eef5;--mute:#9db0bf;--line:#2c4050;--acc:#4fb59d;--acc-ink:#07211b;--gold:#f0bd4a}}
:root[data-theme=dark]{--bg:#0f1a24;--panel:#17252f;--ink:#e6eef5;--mute:#9db0bf;--line:#2c4050;--acc:#4fb59d;--acc-ink:#07211b;--gold:#f0bd4a}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Tajawal,Tahoma,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 20px;border-bottom:6px solid var(--gold)}
header h1{margin:0;font-size:1.7rem;font-weight:800}
header p{margin:4px 0 0;opacity:.85}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.drop{border:2px dashed var(--acc);border-radius:10px;padding:30px 16px;text-align:center;cursor:pointer}
.drop.over,.drop:focus-visible{background:color-mix(in srgb,var(--acc) 12%,transparent);outline:none}
.drop strong{display:block;font-size:1.2rem}
.drop span{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:2px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#status{margin-top:10px;color:var(--mute);min-height:1.5em}
.scroll{overflow-x:auto}
#sheet{background:var(--sheet);color:var(--sheet-ink);font-family:Amiri,'Traditional Arabic',serif;font-size:17px;line-height:1.8;padding:28px;min-width:720px;border:1px solid var(--line)}
#sheet h2{text-align:center;margin:0 0 4px;font-size:1.7rem}
#sheet .sub{text-align:center;margin:0 0 14px}
#sheet table{width:100%;border-collapse:collapse;margin-bottom:14px}
#sheet td,#sheet th{border:1px solid #333;padding:6px 10px;vertical-align:top}
#sheet th{background:#e7eef0;text-align:center}
#sheet .k{width:16%;background:#f3f3ee;font-weight:700}
#sheet [contenteditable]:focus{outline:2px solid #e0a526;background:#fffbe9}
#sheet .l{white-space:pre-wrap}
#sheet .del{display:none}
.hint{color:var(--mute);font-size:.9rem}
@media print{body{background:#fff}header,.noprint,.panel:not(.sheetp){display:none!important}.wrap{padding:0;max-width:none}.sheetp{border:0;padding:0;margin:0}.scroll{overflow:visible}#sheet{border:0;padding:0;min-width:0}@page{size:A4;margin:12mm}}
</style>
</head>
<body>
<header>
  <h1>مولّد المذكرة اليومية</h1>
  <p>المدرسة الرائدة · اللغة العربية · المستويان الخامس والسادس</p>
</header>
<main class="wrap">
  <section class="panel noprint">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="رفع ملف عرض تقديمي">
      <strong>اسحب ملف العرض (.pptx) إلى هنا أو انقر للاختيار</strong>
      <span>تتم القراءة داخل متصفحك فقط، ولا يُرسَل الملف إلى أي خادم.</span>
      <input id="file" type="file" accept=".pptx" multiple hidden>
    </div>
    <div id="status" role="status"></div>
    <div class="bar" id="filesBar"></div>
  </section>

  <section class="panel noprint">
    <div class="grid">
      <div><label for="school">المؤسسة</label><input id="school" value="المدرسة الرائدة"></div>
      <div><label for="teacher">الأستاذ(ة)</label><input id="teacher" placeholder="الاسم الكامل"></div>
      <div><label for="year">السنة الدراسية</label><input id="year" value="2026 – 2027"></div>
      <div><label for="level">المستوى</label><select id="level"><option>الخامس ابتدائي</option><option>السادس ابتدائي</option></select></div>
      <div><label for="date">التاريخ</label><input id="date" type="date"></div>
      <div><label for="week">الأسبوع</label><input id="week" placeholder="مثال: الأسبوع 3"></div>
      <div><label for="dur">مدة الحصة</label><input id="dur" value="45 د"></div>
    </div>
  </section>

  <section class="panel sheetp">
    <div class="bar noprint" style="margin:0 0 12px">
      <button id="print">طباعة / حفظ PDF</button>
      <button class="alt" id="word">تنزيل Word</button>
      <button class="alt" id="addRow">إضافة مرحلة</button>
      <button class="alt" id="theme">الوضع الداكن / الفاتح</button>
    </div>
    <p class="hint noprint">كل خانة في المذكرة قابلة للتعديل بالنقر عليها.</p>
    <div class="scroll"><div id="sheet"></div></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const DOMAINS=["الظاهرة الصرفية","الظاهرة التركيبية","التواصل الشفهي","الإنتاج الكتابي","الصرف والتحويل","القراءة","التعبير","الإملاء","التراكيب","المحفوظات","الخط","الكتابة","التطبيق"];
const RX={obj:/أهداف|هدف|كفاية|كفايات/,res:/وسائل|الدعامات|الدعامة|العدة|الموارد/};
let data={title:"",domain:"",objectives:"",resources:"",phases:[]};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function parsePptx(file){
  const zip=await JSZip.loadAsync(file);
  const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
  const slides=[];
  for(const n of names){
    const xml=new DOMParser().parseFromString(await zip.file(n).async("string"),"application/xml");
    const lines=[...xml.getElementsByTagName("a:p")]
      .map(p=>[...p.getElementsByTagName("a:t")].map(t=>t.textContent).join("").trim()).filter(Boolean);
    if(lines.length)slides.push(lines);
  }
  return slides;
}

function build(slides,fileName){
  const all=slides.flat().join(" ")+" "+fileName;
  const d={title:"",domain:"",objectives:[],resources:[],phases:[]};
  d.title=slides[0]?slides[0][0]:fileName.replace(/\.pptx$/i,"");
  d.domain=(DOMAINS.find(x=>all.includes(x)))||"";
  slides.forEach((lines,i)=>{
    const head=lines[0],body=lines.slice(1);
    if(RX.obj.test(head)){d.objectives.push(...(body.length?body:lines));return}
    if(RX.res.test(head)){d.resources.push(...(body.length?body:lines));return}
    if(i===0&&lines.length<=3&&slides.length>1)return;
    d.phases.push({name:body.length?head:"مرحلة "+(d.phases.length+1),teacher:(body.length?body:lines).join("\n"),learner:"",time:""});
  });
  d.objectives=d.objectives.join("\n");d.resources=d.resources.join("\n");
  if(/السادس/.test(all))$("level").value="السادس ابتدائي";
  else if(/الخامس/.test(all))$("level").value="الخامس ابتدائي";
  return d;
}

const fmtDate=v=>v?new Date(v+"T12:00").toLocaleDateString("ar-MA",{weekday:"long",year:"numeric",month:"long",day:"numeric"}):"";
const E=(t,cls="")=>`<div contenteditable="true" class="${cls}">${esc(t||"")}</div>`;

function render(){
  const ph=data.phases.map((p,i)=>`<tr><td class="k">${E(p.name)}</td><td class="l">${E(p.teacher,"l")}</td><td>${E(p.learner,"l")}</td><td style="width:9%">${E(p.time)}</td></tr>`).join("");
  $("sheet").innerHTML=`
  <h2>المذكرة اليومية</h2>
  <p class="sub">${esc($("school").value)} · السنة الدراسية ${esc($("year").value)}</p>
  <table>
   <tr><td class="k">الأستاذ(ة)</td><td>${esc($("teacher").value)}</td><td class="k">المستوى</td><td>${esc($("level").value)}</td></tr>
   <tr><td class="k">المادة</td><td>اللغة العربية</td><td class="k">المجال / النشاط</td><td>${E(data.domain)}</td></tr>
   <tr><td class="k">التاريخ</td><td>${esc(fmtDate($("date").value))}</td><td class="k">الأسبوع · المدة</td><td>${esc($("week").value)} · ${esc($("dur").value)}</td></tr>
   <tr><td class="k">الموضوع</td><td colspan="3">${E(data.title)}</td></tr>
   <tr><td class="k">الأهداف</td><td colspan="3" class="l">${E(data.objectives,"l")}</td></tr>
   <tr><td class="k">الوسائل والدعامات</td><td colspan="3" class="l">${E(data.resources,"l")}</td></tr>
  </table>
  <table>
   <tr><th style="width:16%">المرحلة</th><th>أنشطة التعليم (المدرّس)</th><th style="width:28%">أنشطة التعلّم (المتعلم)</th><th>المدة</th></tr>
   ${ph||`<tr><td colspan="4" style="text-align:center">ارفع ملف .pptx لملء المراحل تلقائيًا</td></tr>`}
  </table>
  <table><tr><td class="k">ملاحظات</td><td>${E("")}</td></tr></table>`;
}

function readSheet(){
  const rows=[...$("sheet").querySelectorAll("table:nth-of-type(2) tr")].slice(1);
  data.phases=rows.filter(r=>r.children.length===4).map(r=>{const c=[...r.children].map(x=>x.innerText.trim());return{name:c[0],teacher:c[1],learner:c[2],time:c[3]}});
}

async function load(files){
  const list=[...files].filter(f=>/\.pptx$/i.test(f.name));
  if(!list.length){$("status").textContent="الملف غير مدعوم. اختر ملفًا بصيغة .pptx";return}
  $("status").textContent="جارٍ قراءة الملف…";
  window._plans=window._plans||{};
  for(const f of list){
    try{const s=await parsePptx(f);window._plans[f.name]=build(s,f.name)}
    catch(e){$("status").textContent="تعذّرت قراءة «"+f.name+"». تأكد أنه ملف PowerPoint حديث (.pptx).";return}
  }
  const bar=$("filesBar");bar.innerHTML="";
  Object.keys(window._plans).forEach(n=>{const b=document.createElement("button");b.className="alt";b.textContent=n;b.onclick=()=>{data=window._plans[n];render();$("status").textContent="تم عرض مذكرة: "+n};bar.append(b)});
  const last=list[list.length-1].name;data=window._plans[last];render();
  $("status").textContent="تم ملء المذكرة من «"+last+"». راجعها وعدّلها قبل الطباعة.";
}

const drop=$("drop");
drop.onclick=()=>$("file").click();
drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click()}};
$("file").onchange=e=>load(e.target.files);
["dragover","dragenter"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>load(e.dataTransfer.files));

["school","teacher","year","level","date","week","dur"].forEach(id=>{
  $(id).addEventListener("input",()=>{readSheet();syncTop();render();save()});
});
function syncTop(){const t=$("sheet").querySelectorAll("td[contenteditable],div[contenteditable]");}
function save(){try{localStorage.setItem("mdh",JSON.stringify({school:$("school").value,teacher:$("teacher").value,year:$("year").value}))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem("mdh")||"{}");["school","teacher","year"].forEach(k=>{if(s[k])$(k).value=s[k]})}catch(e){}
$("date").value=new Date().toISOString().slice(0,10);

$("print").onclick=()=>window.print();
$("addRow").onclick=()=>{readSheet();data.phases.push({name:"مرحلة جديدة",teacher:"",learner:"",time:""});render()};
$("word").onclick=()=>{
  const html="<html dir='rtl' lang='ar'><head><meta charset='utf-8'><style>body{font-family:Arial}table{width:100%;border-collapse:collapse}td,th{border:1px solid #000;padding:5px}th{background:#e7eef0}.k{background:#f3f3ee;font-weight:bold}</style></head><body>"+$("sheet").innerHTML.replace(/ contenteditable="true"/g,"")+"</body></html>";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff",html],{type:"application/msword"}));
  a.download="المذكرة اليومية.doc";a.click();URL.revokeObjectURL(a.href);
};
$("theme").onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0f1a24";r.dataset.theme=dark?"light":"dark"};
render();
</script>
</body>
</html>
