<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المذكرة اليومية – المدرسة الرائدة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#16294a;--mute:#5b6b7a;--line:#cfd8e0;--acc:#243a8c;--acc-ink:#fff;--gold:#c9961a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1824;--panel:#172433;--ink:#e6eef5;--mute:#9db0bf;--line:#2c4050;--acc:#8fa6f0;--acc-ink:#0b1430;--gold:#f0bd4a}}
:root[data-theme=dark]{--bg:#0f1824;--panel:#172433;--ink:#e6eef5;--mute:#9db0bf;--line:#2c4050;--acc:#8fa6f0;--acc-ink:#0b1430;--gold:#f0bd4a}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Tajawal,Tahoma,sans-serif}
header{background:var(--acc);color:var(--acc-ink);padding:18px 20px;border-bottom:5px solid var(--gold)}
header h1{margin:0;font-size:1.5rem;font-weight:800}
header p{margin:2px 0 0;opacity:.85;font-size:.95rem}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.drop{border:2px dashed;border-radius:10px;padding:20px 12px;text-align:center;cursor:pointer}
.drop.g0{border-color:#243a8c;background:color-mix(in srgb,#243a8c 8%,transparent)}
.drop.g1{border-color:#b08a1e;background:color-mix(in srgb,#b08a1e 10%,transparent)}
.drop.over{outline:3px solid var(--gold)}
.drop strong{display:block}
.drop small{color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:block;font-size:.85rem;color:var(--mute)}
input{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#status{color:var(--mute);min-height:1.5em;margin-top:8px}
.scroll{overflow-x:auto}
/* ===== المذكرة ===== */
#sheet{background:#fff;color:#1a1a1a;padding:14px;min-width:760px;font-family:Tajawal,Tahoma,sans-serif;font-size:14px;border:1px solid var(--line)}
#sheet .dt{text-align:center;font-size:17px;margin:0 0 10px}
#sheet .dt b{color:#243a8c}
#sheet table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #9fb0c4}
#sheet td{border:1px solid #9fb0c4;padding:4px 8px;vertical-align:top}
#sheet td.n{width:38px;padding:2px;text-align:center}
#sheet tr{break-inside:avoid}
.h0{background:#dde1ef;color:#1d2f78}.h1{background:#ece7d4;color:#7d5e0c}
.hr{display:flex;justify-content:space-between;gap:10px;margin:5px 0;font-weight:700}
.ed{display:inline-block;min-width:70px;border-bottom:1px dotted #777;font-weight:400;color:#111;vertical-align:bottom}
.hr .ed{min-width:90px}
.ed:empty::after{content:"\200b"}
.vt{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;padding:6px 0;margin:auto}
.lines{min-height:78px;line-height:26px;background:repeating-linear-gradient(to bottom,transparent 0 25px,#aab8c8 25px 26px);white-space:pre-wrap;color:#111;padding:0 2px}
.an{font-weight:800;text-decoration:underline}
.a0 .an{color:#243a8c}.a1 .an{color:#8a6a10}
.tm{display:block;min-width:0;width:100%;text-align:center;font-size:12px}
#sheet [contenteditable]:focus{outline:2px solid #c9961a;background:#fffbe6}
.tb{font-weight:800}
@media print{body{background:#fff}header,.noprint{display:none!important}.wrap{padding:0;max-width:none}.panel{border:0;padding:0;margin:0}.scroll{overflow:visible}#sheet{border:0;padding:0;min-width:0}#sheet [contenteditable]:focus{outline:0;background:none}@page{size:A4;margin:8mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header>
  <h1>المذكرة اليومية</h1>
  <p>المدرسة الرائدة · اللغة العربية · المستويان الخامس والسادس</p>
</header>
<main class="wrap">
  <section class="panel noprint">
    <div class="two">
      <div class="drop g0" id="d0" tabindex="0" role="button" aria-label="رفع ملف الفوج الأول">
        <strong>الفوج الأول (العمود الأزرق)</strong><small>اسحب ملف .pptx أو انقر للاختيار</small><small id="n0" style="display:block"></small>
        <input type="file" id="f0" accept=".pptx" hidden>
      </div>
      <div class="drop g1" id="d1" tabindex="0" role="button" aria-label="رفع ملف الفوج الثاني">
        <strong>الفوج الثاني (العمود البيج)</strong><small>اسحب ملف .pptx أو انقر للاختيار</small><small id="n1" style="display:block"></small>
        <input type="file" id="f1" accept=".pptx" hidden>
      </div>
    </div>
    <div id="status" role="status">تُقرأ الملفات داخل متصفحك فقط، ولا تُرسَل إلى أي خادم.</div>
  </section>

  <section class="panel">
    <div class="row noprint" style="margin-bottom:12px">
      <div><label for="date">تاريخ اليوم</label><input type="date" id="date"></div>
      <button id="print">طباعة / حفظ PDF</button>
      <button class="alt" id="word">تنزيل Word</button>
      <button class="alt" id="add">إضافة نشاط</button>
      <button class="alt" id="reset">مذكرة جديدة</button>
      <button class="alt" id="theme">الوضع الداكن / الفاتح</button>
    </div>
    <div class="scroll"><div id="sheet"></div></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const RX={obj:/أهداف|هدف|كفاية|كفايات/,res:/وسائل|الدعامات|الدعامة|العدة|الموارد/};
const act=()=>({time:"",title:"",text:""});
const mk=()=>({timing:"",level:"",path:"",block:"",session:"",support:"",topic:"",objectives:"",acts:[act(),act(),act(),act()]});
let G=[mk(),mk()];
const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function parsePptx(file){
  const zip=await JSZip.loadAsync(file);
  const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
  const slides=[];
  for(const n of names){
    const xml=new DOMParser().parseFromString(await zip.file(n).async("string"),"application/xml");
    const lines=[...xml.getElementsByTagName("a:p")]
      .map(p=>[...p.getElementsByTagName("a:t")].map(t=>t.textContent).join("").trim()).filter(Boolean);
    if(lines.length)slides.push(lines);
  }
  return slides;
}
function fill(g,slides,name){
  const d=mk(),obj=[],acts=[];
  d.topic=slides.length?slides[0][0]:name.replace(/\.pptx$/i,"");
  slides.forEach((lines,i)=>{
    const head=lines[0],body=lines.slice(1);
    if(RX.obj.test(head)){obj.push(...(body.length?body:lines));return}
    if(RX.res.test(head))return;
    if(i===0&&slides.length>1&&lines.length<=3)return;
    acts.push({time:"",title:body.length?head:"",text:(body.length?body:lines).join("\n")});
  });
  d.objectives=obj.join("\n");
  while(acts.length<4)acts.push(act());
  d.acts=acts;
  const old=G[g];["timing","level","path","block","session","support"].forEach(k=>d[k]=old[k]);
  G[g]=d;
  const m=Math.max(G[0].acts.length,G[1].acts.length);
  G.forEach(x=>{while(x.acts.length<m)x.acts.push(act())});
}

function readSheet(){
  document.querySelectorAll("#sheet [data-k]").forEach(el=>{
    const g=+el.dataset.g,k=el.dataset.k,v=el.innerText.replace(/\u200b/g,"").trim();
    if(el.dataset.i!==undefined)G[g].acts[+el.dataset.i][k]=v;else G[g][k]=v;
  });
}
const F=(g,k,v,i)=>`<span class="ed" contenteditable="true" data-g="${g}" data-k="${k}"${i!==undefined?` data-i="${i}"`:""}>${esc(v)}</span>`;
const H=g=>{const d=G[g];return `<td colspan="2" class="h${g}">
 <div class="hr"><span>التوقيت: ${F(g,"timing",d.timing)}</span></div>
 <div class="hr"><span>المستوى: ${F(g,"level",d.level)}</span><span>المسار: ${F(g,"path",d.path)}</span></div>
 <div class="hr"><span>اللبنة: ${F(g,"block",d.block)}</span><span>الحصة: ${F(g,"session",d.session)}</span></div>
 <div class="hr"><span>يوم الدعم: ${F(g,"support",d.support)}</span></div></td>`};
function dateText(){
  const v=$("date").value;if(!v)return "";
  const d=new Date(v+"T12:00"),p=n=>String(n).padStart(2,"0");
  return d.toLocaleDateString("ar-MA",{weekday:"long"})+" – "+p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear();
}
function render(){
  const obj=g=>`<td class="n h${g}"><div class="vt">الأهداف</div></td><td><div class="lines" contenteditable="true" data-g="${g}" data-k="objectives" style="min-height:78px">${esc(G[g].objectives)}</div></td>`;
  const sub=g=>`<td class="n h${g} tb">ت</td><td class="h${g} tb">مضامين الأنشطة الخاصة بالفوج: ${F(g,"topic",G[g].topic)}</td>`;
  let rows="";
  const m=G[0].acts.length;
  for(let i=0;i<m;i++){
    rows+="<tr>"+[0,1].map(g=>{const a=G[g].acts[i];return `<td class="n">${F(g,"time",a.time,i).replace('class="ed"','class="ed tm"')}</td>
     <td class="a${g}"><div><span class="an">النشاط ${i+1}:</span> ${F(g,"title",a.title,i)}</div><div class="lines" contenteditable="true" data-g="${g}" data-k="text" data-i="${i}" style="min-height:104px">${esc(a.text)}</div></td>`}).join("")+"</tr>";
  }
  $("sheet").innerHTML=`<p class="dt">تاريخ اليوم: <b>${esc(dateText())}</b></p>
  <table><colgroup><col style="width:38px"><col><col style="width:38px"><col></colgroup>
  <tr>${H(0)}${H(1)}</tr>
  <tr>${obj(0)}${obj(1)}</tr>
  <tr>${sub(0)}${sub(1)}</tr>${rows}</table>`;
}

async function load(g,file){
  if(!file)return;
  if(!/\.pptx$/i.test(file.name)){$("status").textContent="الملف غير مدعوم. اختر ملفًا بصيغة .pptx";return}
  $("status").textContent="جارٍ قراءة الملف…";
  try{
    const s=await parsePptx(file);
    readSheet();fill(g,s,file.name);render();
    $("n"+g).textContent=file.name;
    $("status").textContent="تم ملء الفوج "+(g?"الثاني":"الأول")+". راجع المذكرة وعدّلها قبل الطباعة.";
  }catch(e){$("status").textContent="تعذّرت قراءة الملف. تأكد أنه ملف PowerPoint حديث (.pptx)."}
}
[0,1].forEach(g=>{
  const d=$("d"+g),f=$("f"+g);
  d.onclick=()=>f.click();
  d.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f.click()}};
  f.onchange=e=>{load(g,e.target.files[0]);f.value=""};
  ["dragover","dragenter"].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.add("over")}));
  ["dragleave","drop"].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.remove("over")}));
  d.addEventListener("drop",e=>load(g,e.dataTransfer.files[0]));
});
const t=new Date();$("date").value=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
$("date").oninput=()=>{readSheet();render()};
$("print").onclick=()=>{readSheet();window.print()};
$("add").onclick=()=>{readSheet();G.forEach(x=>x.acts.push(act()));render()};
$("reset").onclick=()=>{if(confirm("مسح المذكرة الحالية؟")){G=[mk(),mk()];$("n0").textContent=$("n1").textContent="";render()}};
$("word").onclick=()=>{
  readSheet();
  const css="body{font-family:Arial}table{width:100%;border-collapse:collapse}td{border:1px solid #889;padding:4px;vertical-align:top}.h0{background:#dde1ef}.h1{background:#ece7d4}.hr{margin:4px 0}.vt{font-weight:bold}.lines{white-space:pre-wrap;min-height:70px}";
  const html="<html dir='rtl' lang='ar'><head><meta charset='utf-8'><style>"+css+"</style></head><body>"+$("sheet").innerHTML.replace(/ contenteditable="true"/g,"")+"</body></html>";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff",html],{type:"application/msword"}));
  a.download="المذكرة اليومية.doc";a.click();URL.revokeObjectURL(a.href);
};
$("theme").onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0f1824";r.dataset.theme=dark?"light":"dark"};
render();
</script>
</body>
</html>
